[project]
name = "leverte_ia_tjenester"
version = "0.1.0"
description = "Datafortelling basert på data fra Fia"
authors = [{name="NAV-IT"}]
readme = "README.md"
requires-python = ">=3.14.6,<3.15"
dependencies = [
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "cryptography>=50.0.1",
    "db-dtypes==1.9.0",
    "google-auth==2.62.0",
    "google-cloud-bigquery==3.46.2",
    "ipython==9.17.1",
    "jupyter-client==8.10.0",
    "jupyter-server==2.21.1",
    "mistune>=3.3.4",
    "notebook==7.6.3",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "plotly==7.1.0",
    "requests==2.34.2",
    "tabulate==0.10.0",
    "tornado>=6.5.10"
]

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/navikt/fia-datafortelling.git"

##### Pytest options
[tool.pytest.ini_options]
addopts = "-ra -q" # reduserer output så lenge alle tester består
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "nbstripout==0.9.1",
    "pre-commit==4.7.0",
    "pytest==9.1.1",
]
