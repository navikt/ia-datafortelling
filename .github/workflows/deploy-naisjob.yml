name: Build and deploy Naisjob
run-name: Build and deploy naisjob || ${{ github.event.head_commit.message }}

on:
  push:
    branches:
      - main
      - upgrade-avhengigheter-okt-2026
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    name: Test med syntetiske data
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen && uv lock --check && uv run pytest

  docker-build-smoke:
    name: Bygg Docker-image uten deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade-avhengigheter-okt-2026'
    needs: smoke-test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag ia-datafortelling:ci .

  docker-build-push:
    name: Build and push docker image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: smoke-test
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Push to Google Artifact Registry
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: teamia
    outputs:
      image: ${{ steps.docker-push.outputs.image }}

  deploy-naisjob-to-prod:
    permissions:
      contents: read
      id-token: write
    name: Deploy to prod-gcp
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build-push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: nais/deploy/actions/deploy@f93637de5533a1bb573f940ceb7527a5b3b0dea0 # v2
        env:
          CLUSTER: prod-gcp
          IMAGE: ${{ needs.docker-build-push.outputs.image }}
          RESOURCE: .nais/prod.yaml

  trivy-scan:
    name: Scanner docker image med Trivy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-build-push
    permissions:
      contents: read
      security-events: write # push sarif to GitHub security
      id-token: write # for nais/login
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: navikt/pia-actions/trivy-scan@80bfd2bc5d4e1eac799d806fff2a018829ff04c4 # 1.1.17
        with:
          image: ${{ needs.docker-build-push.outputs.image }}
          team: teamia
